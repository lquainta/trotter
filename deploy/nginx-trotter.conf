# nginx sits in front of Trotter as a reverse proxy: it takes port 80 (and 443
# for HTTPS) and hands requests to Puma on port 3000.
#
# setup-ec2.sh copies this to /etc/nginx/conf.d/trotter.conf. With --https it
# then runs certbot, which adds HTTPS to the trotter-app.com server block below
# and redirects that domain's plain HTTP to HTTPS.

# Requests to the bare IP address (http://<PUBLIC-IP>/) stay on plain HTTP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/trotter-proxy.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name trotter-app.com www.trotter-app.com;

    include /etc/nginx/snippets/trotter-proxy.conf;
}
