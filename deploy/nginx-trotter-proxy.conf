# Shared proxy settings for both server blocks in nginx-trotter.conf.
# setup-ec2.sh copies this to /etc/nginx/snippets/trotter-proxy.conf.

server_tokens off;

# Rides can have up to 10 photos of up to 20 MB each. nginx's default limit is 1 MB.
client_max_body_size 250m;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # Pass along who the request really came from and whether it used HTTPS,
    # so Rails builds correct URLs (e.g. for photos) and logs real visitor IPs.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
}
